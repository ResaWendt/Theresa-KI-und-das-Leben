  const btn = document.createElement('button');
  btn.textContent = 'Als PNG speichern';
  btn.style.cssText = 'position:fixed;bottom:20px;right:20px;padding:12px 24px;background:#e8279e;color:#fff;border:none;border-radius:8px;font-family:Red Hat Text,sans-serif;font-size:14px;cursor:pointer;font-weight:700;z-index:100';
  btn.onclick = () => {
    const svg = document.getElementById('diagram');
    const svgData = new XMLSerializer().serializeToString(svg);
    const canvas = document.createElement('canvas');
    canvas.width = 2800; canvas.height = 2500;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, 2800, 2500);
      const a = document.createElement('a');
      a.download = 'wie-ki-fragen-beantwortet.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
  };
  document.body.appendChild(btn);
});
</script>
</body>
</html>
